<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satvik Dark Mode Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  :root { --page: #e9e9e6; --page-text: #1d1d1b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #2b2b2b; --page-text: #eee; } }
  :root[data-theme="dark"] { --page: #2b2b2b; --page-text: #eee; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); color: var(--page-text); font-family: Figtree, system-ui, sans-serif; padding: 28px 16px 48px; }
  h1 { font-family: "Young Serif", serif; font-weight: 400; font-size: 26px; text-align: center; }
  .lead { text-align: center; opacity: .7; margin: 6px 0 26px; font-size: 14px; }
  .row { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tag { font-weight: 700; font-size: 15px; }
  .sub { font-size: 12.5px; opacity: .65; text-align: center; max-width: 300px; }
  .swatches { display: flex; gap: 6px; }
  .swatches span { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(127,127,127,.35); }

  /* Phone */
  .phone { width: 340px; height: 736px; border-radius: 44px; padding: 10px; background: #000; box-shadow: 0 18px 40px rgba(0,0,0,.28); }
  .screen { position: relative; height: 100%; border-radius: 35px; overflow: hidden; background: var(--bg); color: var(--text); }
  .status { display: flex; justify-content: space-between; padding: 14px 26px 0; font-size: 13px; font-weight: 600; }
  .scroll { padding: 10px 16px 90px; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { width: 34px; height: 34px; }
  .greet { font-size: 11.5px; color: var(--muted); }
  .title { font-family: "Young Serif", serif; font-size: 19px; color: var(--title); line-height: 1.1; }
  .bell { width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; }
  .hero { background: #235C3B; border-radius: 20px; padding: 16px; color: #fff; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.07); }
  .hero .k { font-size: 10px; letter-spacing: .6px; opacity: .8; }
  .hero .h { font-family: "Young Serif", serif; font-size: 19px; margin: 6px 0 3px; }
  .hero .d { font-size: 12.5px; opacity: .9; }
  .hero .btn { margin-top: 12px; background: #fff; color: #143D27; border-radius: 999px; text-align: center; padding: 10px; font-weight: 600; font-size: 13.5px; }
  .label { color: var(--primary); font-size: 10.5px; letter-spacing: .9px; font-weight: 600; margin: 16px 2px 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .qa { background: var(--surface); border: 1px solid var(--edge); border-radius: 16px; padding: 11px; display: flex; gap: 9px; align-items: center; }
  .ic { width: 32px; height: 32px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; flex: none; }
  .qa b { display: block; font-size: 12.5px; font-weight: 600; }
  .qa i { font-style: normal; font-size: 10.5px; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--edge); border-radius: 18px; padding: 13px; margin-top: 8px; }
  .row2 { display: flex; justify-content: space-between; align-items: baseline; }
  .k2 { color: var(--primary); font-size: 10px; letter-spacing: .8px; font-weight: 600; }
  .h2 { font-family: "Young Serif", serif; font-size: 16px; margin-top: 2px; }
  .link { color: var(--primary); font-size: 12px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .tile { background: var(--surface2); border-radius: 12px; padding: 8px; }
  .tile small { display: block; font-size: 9px; letter-spacing: .6px; color: var(--muted); margin-top: 4px; }
  .tile span { font-size: 10.5px; font-weight: 600; }
  .diet { background: #235C3B; border-radius: 16px; padding: 12px 14px; margin-top: 10px; color: #fff; }
  .diet .k3 { color: #EC9C13; font-size: 10px; letter-spacing: .8px; font-weight: 700; }
  .diet .h3 { font-family: "Young Serif", serif; font-size: 15.5px; margin: 3px 0 2px; }
  .diet small { font-size: 10.5px; opacity: .85; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: var(--tabbar); border-top: 1px solid var(--tabborder); border-radius: 18px 18px 0 0; display: flex; justify-content: space-around; padding-top: 8px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; color: var(--inactive); font-weight: 600; }
  .tab .pill { width: 50px; height: 28px; border-radius: 999px; display: grid; place-items: center; }
  .tab.on { color: var(--primary); }
  .tab.on .pill { background: var(--soft); }
  svg { display: block; }
</style>
</head>
<body>
  <h1>Satvik Salaad — dark mode options</h1>
  <p class="lead">Home screen in dark mode. Brand green stays on buttons, icons and the two green cards; only the background greys change.</p>

  <div class="row" id="row"></div>

<template id="phone">
  <div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>●●● ▮</span></div>
    <div class="scroll">
      <div class="header">
        <div class="brand">
          <svg class="mark" viewBox="0 0 40 40"><circle cx="10" cy="11" r="3.2" fill="#7BAE3F"/><path d="M15 15c4-9 13-11 20-10-2 8-9 13-20 10z" fill="#7BAE3F"/><path d="M4 21h32c-1 7-7 11-16 11S5 28 4 21z" fill="var(--primary)"/><rect x="14" y="32" width="12" height="3" rx="1.5" fill="var(--primary)"/></svg>
          <div><div class="greet">Good afternoon, Asha</div><div class="title">Satvik Salaad</div></div>
        </div>
        <div class="bell"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></div>
      </div>

      <div class="hero">
        <div class="k">YOUR SUBSCRIPTIONS</div>
        <div class="h">No subscription yet</div>
        <div class="d">Fresh bowls on the days you choose, lunch or dinner.</div>
        <div class="btn">Choose a plan</div>
      </div>

      <div class="label">QUICK ACTIONS</div>
      <div class="grid">
        <div class="qa"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div><div><b>Skip a day</b><i>Free, before the cutoff</i></div></div>
        <div class="qa"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></div><div><b>Choose a plan</b><i>Weekly or monthly</i></div></div>
        <div class="qa"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></div><div><b>Settings</b><i>App preferences</i></div></div>
        <div class="qa"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8"><path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 2-3 5-3 8h3v10"/></svg></div><div><b>Menu</b><i>See the menu</i></div></div>
      </div>

      <div class="card">
        <div class="row2"><div><div class="k2">TODAY AT SATVIK</div><div class="h2">Wednesday 28 Oct</div></div><div class="link">Full menu ›</div></div>
        <div class="tiles">
          <div class="tile"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M5 19c0-8 6-14 15-15-1 9-7 15-15 15zM5 19l7-7"/></svg><small>SALAD</small><span>Smoky Paneer Salad</span></div>
          <div class="tile"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6zM17 9h2a2 2 0 0 1 0 4h-2"/></svg><small>SOUP</small><span>Tomato Corn Bliss Soup</span></div>
          <div class="tile"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg><small>JUICE</small><span>Sattu Protein Drink</span></div>
        </div>
      </div>

      <div class="diet">
        <div class="k3">1:1 DIET CONSULTATION</div>
        <div class="h3">Plan your diet with Divya Agrawal</div>
        <small>Our founder and clinical dietitian · from ₹1,000</small>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab on"><div class="pill"><svg width="19" height="19" viewBox="0 0 24 24" fill="var(--primary)"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div>Home</div>
      <div class="tab"><div class="pill"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--inactive)" stroke-width="1.8"><path d="M5 19c0-8 6-14 15-15-1 9-7 15-15 15zM5 19l7-7"/></svg></div>Menu</div>
      <div class="tab"><div class="pill"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--inactive)" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg></div>Videos</div>
      <div class="tab"><div class="pill"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--inactive)" stroke-width="1.8"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="m6 16 4-7h5l3 7M10 9 8 6H6"/></svg></div>Deliveries</div>
      <div class="tab"><div class="pill"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--inactive)" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></div>Profile</div>
    </div>
  </div></div>
</template>

<script>
  const options = [
    { name: "Now — green-tinted", note: "Today's dark mode: every grey leans green.",
      v: { bg:"#101814", surface:"#17211C", surface2:"#212C26", edge:"#2A3631", text:"#F4F4F0", muted:"#A8A894", soft:"#27352E", primary:"#34B268", title:"#F4F4F0", tabbar:"#131C17", tabborder:"#313F38", inactive:"#A8A894" } },
    { name: "A — Classic black (recommended)", note: "Near-black with neutral greys; green only where it means something.",
      v: { bg:"#0B0B0B", surface:"#161616", surface2:"#202020", edge:"#262626", text:"#F5F5F5", muted:"#A3A3A3", soft:"#1F2A23", primary:"#3DBE73", title:"#F5F5F5", tabbar:"#111111", tabborder:"#262626", inactive:"#8E8E8E" } },
    { name: "B — Soft charcoal", note: "A little lighter, closer to Android's default dark grey.",
      v: { bg:"#141414", surface:"#1E1E1E", surface2:"#292929", edge:"#303030", text:"#F2F2F2", muted:"#A6A6A6", soft:"#24302A", primary:"#3DBE73", title:"#F2F2F2", tabbar:"#1A1A1A", tabborder:"#2E2E2E", inactive:"#8F8F8F" } },
  ];
  const row = document.getElementById("row");
  const tpl = document.getElementById("phone");
  for (const o of options) {
    const col = document.createElement("div");
    col.className = "col";
    col.innerHTML = `<div class="tag">${o.name}</div><div class="sub">${o.note}</div>
      <div class="swatches">${["bg","surface","surface2","primary"].map(k => `<span title="${k} ${o.v[k]}" style="background:${o.v[k]}"></span>`).join("")}</div>`;
    const phone = tpl.content.cloneNode(true);
    const screen = phone.querySelector(".screen");
    for (const [k, val] of Object.entries(o.v)) screen.style.setProperty(`--${k}`, val);
    col.appendChild(phone);
    row.appendChild(col);
  }
</script>
</body>
</html>
